version: '3.9'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL 16 Database
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: bahavar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bahavar_db}
      POSTGRES_USER: ${POSTGRES_USER:-bahavar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bahavar_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bahavar_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bahavar_user} -d ${POSTGRES_DB:-bahavar_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Django Backend (Gunicorn + REST Framework)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bahavar_django_web
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      USE_SQLITE: "False"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bahavar_network

  # -------------------------------------------------------------
  # 3. Nuxt 3 SSR Frontend Server
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: bahavar_nuxt_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE: http://web:8000/api
      NUXT_PUBLIC_SITE_URL: http://localhost
    networks:
      - bahavar_network
    depends_on:
      - web

  # -------------------------------------------------------------
  # 4. Nginx Reverse Proxy (Gateway)
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: bahavar_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - web
      - frontend
    networks:
      - bahavar_network

volumes:
  postgres_data:
    name: bahavar_postgres_data
  static_volume:
    name: bahavar_static_volume
  media_volume:
    name: bahavar_media_volume

networks:
  bahavar_network:
    name: bahavar_network
    driver: bridge
